services:
  - type: web
    name: sqlite-guard
    runtime: docker
    plan: 4c-16g
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GUARD_API_KEY
        generateValue: true
      - key: GUARD_DB_DIR
        value: /var/data
      - key: GUARD_MODEL_EXTENSION_PATH
        value: /app/extensions/ai
      - key: GUARD_MODEL_PATH
        value: /app/models/qwen2.5-7b-instruct-q4_k_m.gguf
      - key: GUARD_MODEL_GPU_LAYERS
        value: "0"
    disk:
      name: guard-audit-data
      mountPath: /var/data
      sizeGB: 10
